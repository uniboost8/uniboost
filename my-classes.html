<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; media-src 'self' blob: https: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<script src="safe.js"></script>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Classes – Uni Boost</title>
<link rel="stylesheet" href="styles.css">
<script src="theme.js"></script>
</head>
<body>
<div id="site-header"></div>
<main class="wrap">
  <section class="page-hero">
    <p class="crumbs"><a href="index.html">Home</a> / My Classes</p>
    <h1>My <span class="accent">classes</span></h1>
    <p class="sub">Your booked classes, live-class links, materials and recordings, all in one place.</p>
    <form class="lookup" id="lf">
      <input id="phone" type="tel" placeholder="Phone number you booked with" required>
      <input id="pin" type="password" inputmode="numeric" maxlength="10" placeholder="Access code" required autocomplete="current-password">
      <button class="btn btn-primary">Show my classes</button>
    </form>
    <div class="tabs" id="tabs" style="margin-bottom:0">
      <button class="tab on" data-t="up">Upcoming &amp; recordings</button>
      <button class="tab" data-t="past">Past</button>
    </div>
  </section>
  <div id="list" style="margin-bottom:90px"></div>
</main>

<div class="modal" id="vmodal"><div class="box box-wide">
  <h3 id="vtitle">Recording</h3>
  <div id="vbody" style="margin-top:16px"></div>
  <div class="actions"><button class="btn btn-ghost" id="vclose">Close</button></div>
</div></div>

<div id="site-footer"></div>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="site-ui.js"></script>
<script src="pages.js"></script>
</body>
</html>
