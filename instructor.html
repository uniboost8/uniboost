<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://txwxizkmmvkyotpmoloq.supabase.co; media-src 'self' blob: https: https://txwxizkmmvkyotpmoloq.supabase.co; connect-src 'self' https://txwxizkmmvkyotpmoloq.supabase.co; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<script src="safe.js"></script>
<meta name="robots" content="noindex,nofollow">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instructor – Uni Boost</title>
<style>
:root{
    --bg:#0b1220;
    --bg2:#0f192c;
    --card:#16233a;
    --card2:#1e2e4b;
    --line:rgba(148,163,184,.16);
    --text:#f1f5f9;
    --muted:#a8b5c9;
    --accent:#3b82f6;
    --primary:#2563eb;
    --accent2:#60a5fa;
    --violet:#2563eb;
    --radius:22px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    background:
      radial-gradient(900px 500px at 80% -10%, rgba(37,99,235,.16), transparent 60%),
      radial-gradient(700px 500px at 0% 40%, rgba(59,130,246,.05), transparent 60%),
      var(--bg);
    color:var(--text);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  a{color:inherit;text-decoration:none}
  button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
  .wrap{width:min(1180px,100% - 48px);margin-inline:auto}
  .accent{
    background:linear-gradient(90deg,#60a5fa,#93c5fd);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }

  /* ---------- Header ---------- */
  header{
    position:sticky;top:0;z-index:50;
    background:rgba(11,18,32,.72);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .nav{display:flex;align-items:center;justify-content:space-between;height:68px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem;letter-spacing:-.01em}
  .logo i{
    width:28px;height:28px;border-radius:8px;display:grid;place-items:center;
    background:linear-gradient(135deg,#3b82f6,#1d4ed8);
    font-style:normal;font-size:.8rem;font-weight:800;color:#fff;
    box-shadow:0 4px 16px rgba(59,130,246,.45);
  }
  .nav-right{display:flex;align-items:center;gap:14px}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:12px 24px;border-radius:999px;font-weight:600;font-size:.95rem;
    transition:transform .2s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease;
  }
  .btn-primary{
    background:var(--primary);color:#fff;
    box-shadow:0 8px 26px rgba(59,130,246,.35);
  }
  .btn-primary:hover{background:#1d4ed8;transform:translateY(-2px);box-shadow:0 12px 32px rgba(59,130,246,.55)}
  .btn-ghost{border:1.5px solid rgba(255,255,255,.35);color:#fff}
  .btn-ghost:hover{background:rgba(255,255,255,.08);border-color:#fff;transform:translateY(-2px)}
  .btn-sm{padding:9px 18px;font-size:.85rem}
  .burger{width:42px;height:42px;border-radius:12px;display:grid;place-items:center}
  .burger:hover{background:rgba(255,255,255,.08)}
  .burger span,.burger span::before{display:block;width:18px;height:2px;background:#fff;border-radius:2px;position:relative;transition:.25s}
  .burger span::before{content:"";position:absolute;top:6px;left:0}
  .burger span{margin-top:-6px}
  body.menu-open .burger span{transform:translateY(3px) rotate(45deg)}
  body.menu-open .burger span::before{transform:translateY(-6px) rotate(-90deg);top:6px}

  /* Slide-down menu */
  .menu{
    position:fixed;inset:68px 0 auto 0;z-index:40;
    background:rgba(11,18,32,.97);backdrop-filter:blur(16px);
    border-bottom:1px solid var(--line);
    transform:translateY(-120%);opacity:0;pointer-events:none;
    transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .3s;
    padding:12px 0 28px;
  }
  body.menu-open .menu{transform:none;opacity:1;pointer-events:auto}
  .menu a.item{
    display:block;padding:18px 0;font-size:1.05rem;font-weight:600;
    border-bottom:1px solid var(--line);transition:color .2s,padding .2s;
  }
  .menu a.item:hover{color:var(--accent2);padding-left:10px}
  .menu .btn{margin-top:22px}

  /* ---------- Hero ---------- */
  .hero{padding:90px 0 70px}
  .hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center}
  h1{font-size:clamp(2.4rem,5.4vw,4.4rem);line-height:1.04;font-weight:800;letter-spacing:-.035em}
  .hero p.lead{margin-top:22px;color:var(--muted);font-size:1.12rem;max-width:520px}
  .hero-cta{display:flex;flex-wrap:wrap;gap:14px;margin-top:34px}
  .hero-visual{
    position:relative;aspect-ratio:1/1;max-width:520px;width:100%;justify-self:end;
    border-radius:28px;overflow:hidden;
    background:radial-gradient(circle at 50% 50%,#0f1b30 0%,#060b15 70%);
    border:1px solid var(--line);
    box-shadow:0 30px 80px rgba(0,0,0,.55), inset 0 0 80px rgba(37,99,235,.12);
  }
  .hero-visual canvas{position:absolute;inset:0;width:100%;height:100%}

  /* ---------- Trusted ---------- */
  .trusted{padding:30px 0 80px;text-align:center}
  .trusted p{color:var(--muted);font-size:.95rem;margin-bottom:26px}
  .chips{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
  .chip{
    padding:15px 28px;border-radius:16px;font-weight:700;font-size:.9rem;
    background:linear-gradient(180deg,#223a5e,#1a2d4b);
    box-shadow:0 8px 20px rgba(2,8,23,.35), inset 0 1px 0 rgba(255,255,255,.18);
    transition:transform .25s, background .25s;
  }
  .chip:hover{transform:translateY(-4px);background:linear-gradient(180deg,#2b4a78,#223c63)}

  /* ---------- Sections ---------- */
  section{position:relative}
  .sec{padding:90px 0}
  h2{font-size:clamp(1.9rem,3.8vw,3rem);line-height:1.1;font-weight:800;letter-spacing:-.03em}
  .sub{color:var(--muted);margin-top:14px;max-width:620px;font-size:1.05rem}
  .center{text-align:center}
  .center .sub{margin-inline:auto}

  /* Features */
  .features{display:grid;grid-template-columns:repeat(2,1fr);gap:26px;margin-top:56px}
  .feature{
    padding:34px;border-radius:var(--radius);
    background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
    border:1px solid var(--line);
    transition:transform .3s, border-color .3s, background .3s;
  }
  .feature:hover{transform:translateY(-6px);border-color:rgba(59,130,246,.45);background:linear-gradient(160deg,rgba(59,130,246,.09),rgba(255,255,255,.02))}
  .ico{
    width:48px;height:48px;border-radius:14px;display:grid;place-items:center;margin-bottom:20px;
    background:rgba(59,130,246,.13);color:var(--accent);
  }
  .ico svg{width:24px;height:24px}
  .feature h3{font-size:1.28rem;letter-spacing:-.02em;margin-bottom:10px}
  .feature p{color:var(--muted)}

  /* Stats */
  .stats-band{
    background:linear-gradient(180deg,rgba(37,99,235,.22),rgba(37,99,235,.1));
    border-block:1px solid var(--line);
  }
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:30px;padding:70px 0}
  .stat b{display:block;font-size:clamp(2.2rem,4.4vw,3.3rem);font-weight:800;letter-spacing:-.03em;line-height:1}
  .stat span{display:block;margin-top:12px;color:var(--muted);font-size:.95rem;max-width:220px}

  /* Course cards */
  .courses{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:50px}
  .course{
    padding:28px;border-radius:var(--radius);
    background:linear-gradient(160deg,var(--card),#121e33);
    border:1px solid var(--line);
    transition:transform .3s, box-shadow .3s, border-color .3s;
    cursor:pointer;
  }
  .course:hover{transform:translateY(-8px);box-shadow:0 24px 50px rgba(0,0,0,.45);border-color:rgba(255,255,255,.22)}
  .swatches{display:flex;gap:10px;margin-bottom:26px}
  .swatches i{width:46px;height:46px;border-radius:12px;display:block;transition:transform .3s}
  .course:hover .swatches i:nth-child(1){transform:translateY(-4px) rotate(-6deg)}
  .course:hover .swatches i:nth-child(2){transform:translateY(-8px)}
  .course:hover .swatches i:nth-child(3){transform:translateY(-4px) rotate(6deg)}
  .course h3{font-size:1.2rem;letter-spacing:-.02em}
  .course .meta{font-size:.8rem;color:#8b9bb4;margin:6px 0 14px;font-weight:600}
  .course p{color:var(--muted);font-size:.95rem}
  .course .more{display:inline-block;margin-top:18px;color:var(--accent2);font-weight:600;font-size:.9rem}

  /* Tracks */
  .tracks{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:46px}
  .track{
    padding:26px;border-radius:18px;
    background:linear-gradient(160deg,var(--card),#121e33);
    border:1.5px solid transparent;
    transition:border-color .25s, transform .25s, box-shadow .25s;
    cursor:pointer;
  }
  .track:hover,.track.active{border-color:var(--accent);transform:translateY(-4px);box-shadow:0 14px 34px rgba(59,130,246,.2)}
  .track svg{width:22px;height:22px;color:var(--accent);margin-bottom:18px;display:block}
  .track h4{font-size:1.02rem;letter-spacing:-.01em}
  .track small{color:#8b9bb4;font-weight:600}

  /* Schedule */
  .schedule{
    display:grid;grid-template-columns:1fr 1.05fr;gap:50px;align-items:center;
  }
  .schedule .btn{margin-top:30px}
  .photo{
    border-radius:26px;overflow:hidden;aspect-ratio:4/3.1;position:relative;
    box-shadow:0 30px 70px rgba(0,0,0,.5);border:1px solid var(--line);
  }
  .photo svg{width:100%;height:100%;display:block}

  /* Guides */
  .guides-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
  .link-pill{
    padding:9px 18px;border-radius:999px;font-size:.85rem;font-weight:700;color:var(--accent2);
    border:1px solid rgba(96,165,250,.4);transition:.2s;
  }
  .link-pill:hover{background:rgba(96,165,250,.12)}
  .guides{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:46px}
  .guide{
    border-radius:var(--radius);overflow:hidden;
    background:linear-gradient(160deg,var(--card),#121e33);border:1px solid var(--line);
    transition:transform .3s, box-shadow .3s;cursor:pointer;display:flex;flex-direction:column;
  }
  .guide:hover{transform:translateY(-8px);box-shadow:0 26px 54px rgba(0,0,0,.5)}
  .guide .img{aspect-ratio:16/10;background:#070d19;overflow:hidden}
  .guide .img svg{width:100%;height:100%;display:block;transition:transform .6s}
  .guide:hover .img svg{transform:scale(1.07)}
  .guide .body{padding:24px}
  .tag{font:700 .68rem/1 ui-monospace,Menlo,Consolas,monospace;color:var(--accent2);letter-spacing:.08em;text-transform:uppercase}
  .guide h3{font-size:1.15rem;margin:12px 0 8px;letter-spacing:-.02em}
  .guide p{color:var(--muted);font-size:.93rem}

  /* Teams CTA */
  .teams{
    margin:20px auto 100px;padding:70px 56px;border-radius:32px;
    background:
      radial-gradient(500px 260px at 90% 0%, rgba(59,130,246,.35), transparent 70%),
      linear-gradient(135deg,#1e3a8a,#0f1f4d);
    border:1px solid rgba(255,255,255,.12);
    display:flex;justify-content:space-between;align-items:center;gap:30px;flex-wrap:wrap;
  }
  .teams h2{max-width:640px}

  /* Footer */
  footer{border-top:1px solid var(--line);padding:50px 0 40px;color:var(--muted);font-size:.92rem}
  .foot{display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap}
  .foot nav{display:flex;gap:26px;flex-wrap:wrap}
  .foot nav a:hover{color:#fff}
  .copy{margin-top:34px;font-size:.82rem;color:#6f7f99}

  /* Reveal */
  .reveal{opacity:0;transform:translateY(34px);transition:opacity .8s ease, transform .8s cubic-bezier(.2,.8,.2,1)}
  .reveal.in{opacity:1;transform:none}
  .d1{transition-delay:.1s}.d2{transition-delay:.2s}.d3{transition-delay:.3s}

  /* Toast */
  .toast{
    position:fixed;left:50%;bottom:30px;transform:translate(-50%,120px);z-index:80;
    background:#fff;color:#111;padding:14px 22px;border-radius:14px;font-weight:600;
    box-shadow:0 18px 40px rgba(0,0,0,.5);transition:transform .4s cubic-bezier(.2,.8,.2,1);
  }
  .toast.show{transform:translate(-50%,0)}

  @media (max-width:980px){
    .hero-grid,.schedule{grid-template-columns:1fr}
    .hero-visual{justify-self:center;max-width:420px}
    .stats{grid-template-columns:repeat(2,1fr)}
    .courses,.guides{grid-template-columns:1fr 1fr}
    .tracks{grid-template-columns:repeat(2,1fr)}
  }
  @media (max-width:640px){
    .wrap{width:calc(100% - 32px)}
    .features,.courses,.guides{grid-template-columns:1fr}
    .hero{padding:50px 0}
    .sec{padding:64px 0}
    .teams{padding:44px 26px}
    .nav-right .btn{padding:9px 16px;font-size:.82rem}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
    .reveal{opacity:1;transform:none}
  }

/* ================= Sub-pages ================= */
.page-hero{padding:70px 0 30px}
.page-hero h1{font-size:clamp(2rem,4.4vw,3.4rem)}
.crumbs{font-size:.85rem;color:var(--muted);margin-bottom:18px}
.crumbs a:hover{color:#fff}
.toolbar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:34px 0 10px}
.field,.toolbar input,.toolbar select,form input,form select,form textarea{
  width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);color:#fff;
  padding:13px 16px;border-radius:14px;font:inherit;outline:none;transition:border-color .2s,background .2s;
}
.toolbar input{max-width:340px}
.toolbar select{width:auto}
input:focus,select:focus,textarea:focus{border-color:var(--accent);background:rgba(59,130,246,.06)}
select option{background:#0f192c;color:#fff}
textarea{resize:vertical;min-height:90px}
label{display:block;font-size:.82rem;font-weight:700;color:var(--muted);margin:14px 0 6px}
.fchip{padding:9px 18px;border-radius:999px;font-weight:700;font-size:.85rem;border:1px solid var(--line);background:rgba(255,255,255,.04);transition:.2s}
.fchip:hover{border-color:rgba(255,255,255,.3)}
.fchip.on{background:var(--primary);border-color:transparent}

.inst-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin:30px 0 90px}
.inst{
  padding:28px;border-radius:var(--radius);display:block;
  background:linear-gradient(160deg,var(--card),#121e33);border:1px solid var(--line);
  transition:transform .3s,box-shadow .3s,border-color .3s;
}
.inst:hover{transform:translateY(-8px);box-shadow:0 24px 50px rgba(0,0,0,.45);border-color:rgba(59,130,246,.5)}
.avatar{
  width:64px;height:64px;border-radius:18px;display:grid;place-items:center;
  font-weight:800;font-size:1.3rem;color:#fff;margin-bottom:20px;background-size:cover;background-position:center;
  box-shadow:0 10px 24px rgba(0,0,0,.35);
}
.avatar.lg{width:96px;height:96px;border-radius:26px;font-size:2rem;margin:0}
.inst h3{font-size:1.2rem;letter-spacing:-.02em}
.inst .role{color:var(--muted);font-size:.92rem;margin:4px 0 2px}
.inst .uni{font-size:.8rem;font-weight:700;color:#8b9bb4}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.tags span{font-size:.72rem;font-weight:700;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.08);color:#dbe4f0}
.avail{font-size:.85rem;font-weight:700;color:var(--accent2)}
.avail.none{color:#7f90aa}
.empty{padding:60px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius);grid-column:1/-1}

.profile{display:flex;gap:30px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.profile h1{font-size:clamp(1.8rem,4vw,2.8rem)}
.profile .role{color:var(--muted);font-size:1.05rem;margin-top:6px}
.profile p.bio{color:var(--muted);max-width:640px;margin-top:14px}
.panel{
  padding:30px;border-radius:var(--radius);margin:30px 0 90px;
  background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.015));border:1px solid var(--line);
}
.panel h2{font-size:1.5rem;margin-bottom:6px}
.dates{display:flex;gap:12px;overflow-x:auto;padding:18px 2px 8px;scrollbar-width:thin}
.dpill{
  flex:0 0 auto;min-width:92px;padding:14px 16px;border-radius:16px;text-align:center;
  background:linear-gradient(160deg,var(--card),#121e33);border:1.5px solid transparent;transition:.2s;
}
.dpill b{display:block;font-size:1.4rem;line-height:1.1}
.dpill small{color:#8b9bb4;font-weight:700;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
.dpill em{display:block;font-style:normal;font-size:.7rem;color:var(--accent2);font-weight:700;margin-top:4px}
.dpill:hover{border-color:rgba(255,255,255,.25)}
.dpill.on{border-color:var(--accent);box-shadow:0 10px 26px rgba(59,130,246,.22)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-top:22px}
.slot{
  padding:16px 18px;border-radius:16px;text-align:left;
  background:linear-gradient(180deg,#223a5e,#1a2d4b);box-shadow:inset 0 1px 0 rgba(255,255,255,.18);
  transition:transform .2s,background .2s;
}
.slot b{display:block;font-size:1.05rem}
.slot small{font-size:.78rem;opacity:.85;font-weight:600}
.slot:hover:not(:disabled){transform:translateY(-4px);background:linear-gradient(180deg,#3b82f6,#2563eb)}
.slot:disabled{background:rgba(255,255,255,.06);box-shadow:none;cursor:not-allowed;opacity:.6}
.slot:disabled b{text-decoration:line-through}

.day-block{margin-bottom:34px}
.day-block h3{font-size:1.2rem;margin-bottom:14px;letter-spacing:-.01em}
.row-slot{
  display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;
  padding:16px 20px;border-radius:16px;margin-bottom:10px;border:1px solid var(--line);
  background:linear-gradient(160deg,var(--card),#121e33);transition:.2s;
}
.row-slot:hover{border-color:rgba(59,130,246,.5);transform:translateX(4px)}
.row-slot .t{font-weight:800;min-width:90px}
.row-slot .who{flex:1;color:var(--muted);font-size:.95rem}
.row-slot .who b{color:#fff}

/* Modal */
.modal{position:fixed;inset:0;z-index:90;display:none;place-items:center;padding:20px;background:rgba(2,6,14,.72);backdrop-filter:blur(6px)}
.modal.open{display:grid}
.modal .box{
  width:min(480px,100%);max-height:90vh;overflow:auto;padding:30px;border-radius:24px;
  background:linear-gradient(160deg,#1a2a47,#0f192c);border:1px solid rgba(255,255,255,.14);
  box-shadow:0 40px 90px rgba(0,0,0,.6);animation:pop .3s cubic-bezier(.2,.8,.2,1);
}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.97)}}
.modal h3{font-size:1.4rem;letter-spacing:-.02em}
.modal .summary{color:var(--muted);margin-top:6px;font-size:.95rem}
.actions{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap}
.actions .btn{flex:1}
.btn-danger{background:rgba(255,60,60,.14);color:#ff8a8a;border:1px solid rgba(255,90,90,.4)}
.btn-danger:hover{background:rgba(255,60,60,.3);color:#fff}

/* Admin */
.login-box{max-width:420px;margin:70px auto 120px}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:30px 0 24px}
.tab{padding:11px 22px;border-radius:999px;font-weight:700;font-size:.9rem;border:1px solid var(--line);background:rgba(255,255,255,.04);transition:.2s}
.tab.on{background:var(--primary);border-color:transparent}
.admin-top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.table{width:100%;border-collapse:collapse;font-size:.93rem}
.table th{text-align:left;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:#8b9bb4;padding:12px 10px;border-bottom:1px solid var(--line)}
.table td{padding:14px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.table tr:hover td{background:rgba(255,255,255,.03)}
.who-cell{display:flex;align-items:center;gap:12px}
.who-cell .avatar{width:42px;height:42px;font-size:.9rem;border-radius:12px;margin:0}
.scroll-x{overflow-x:auto}
.mini{padding:7px 14px;border-radius:999px;font-size:.78rem;font-weight:700;border:1px solid var(--line);background:rgba(255,255,255,.05);transition:.2s;margin-right:6px}
.mini:hover{background:rgba(255,255,255,.14)}
.mini.del{color:#ff8a8a;border-color:rgba(255,90,90,.35)}
.mini.del:hover{background:rgba(255,60,60,.25);color:#fff}
.badge{font-size:.7rem;font-weight:800;padding:4px 10px;border-radius:999px}
.badge.free{background:rgba(59,224,122,.15);color:#6df0a2}
.badge.taken{background:rgba(239,68,68,.16);color:#fca5a5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:30px}
.help{font-size:.82rem;color:#8b9bb4;margin-top:6px}
.weekdays{display:flex;gap:8px;flex-wrap:wrap}
.weekdays label{display:flex;align-items:center;gap:6px;margin:0;padding:8px 12px;border-radius:999px;border:1px solid var(--line);cursor:pointer;color:#fff}
.weekdays input{width:auto}
.color-pick{display:flex;gap:10px;flex-wrap:wrap}
.color-pick button{width:34px;height:34px;border-radius:10px;border:2px solid transparent}
.color-pick button.on{border-color:#fff}
@media (max-width:980px){.inst-grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}
@media (max-width:640px){.inst-grid{grid-template-columns:1fr}.panel{padding:20px}}



/* ================= My Classes / class management ================= */
.status{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:800;padding:5px 12px;border-radius:999px;letter-spacing:.02em}
.status.s-up{background:rgba(37,99,235,.25);color:#93c5fd}
.status.s-live{background:rgba(59,224,122,.18);color:#6df0a2}
.status.s-end{background:rgba(255,255,255,.08);color:#a8b5c9}
.status.s-warn{background:rgba(245,158,11,.16);color:#fbbf24}
.cc{
  padding:26px;border-radius:var(--radius);margin-bottom:20px;
  background:linear-gradient(160deg,var(--card),#121e33);border:1px solid var(--line);
}
.cc.ended{opacity:.78}
.cc-head{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-start}
.cc h3{font-size:1.4rem;letter-spacing:-.02em}
.cc .meta{color:var(--muted);font-size:.93rem;margin-top:4px}
.cc-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;margin-top:22px}
.cc-box{padding:18px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.cc-box h4{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:#8b9bb4;margin-bottom:12px}
.cc-box p{color:var(--muted);font-size:.9rem}
.cc-box .cd{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin:4px 0}
.join{display:flex;width:100%;padding:15px 20px;font-size:1.02rem}
.mat{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.05);margin-bottom:8px;font-size:.9rem}
.mat span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mat button,.mat a{flex:0 0 auto;font-size:.78rem;font-weight:800;color:var(--accent2);padding:5px 12px;border-radius:999px;border:1px solid rgba(96,165,250,.4)}
.mat button:hover,.mat a:hover{background:rgba(96,165,250,.15)}
.lookup{display:flex;gap:12px;flex-wrap:wrap;max-width:560px;margin:30px 0 10px}
.lookup input{flex:1;min-width:200px}
.box-wide{width:min(720px,100%)!important}
.sec-t{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:#8b9bb4;font-weight:800;margin:26px 0 10px;padding-top:20px;border-top:1px solid var(--line)}
.sec-t:first-of-type{border-top:0;margin-top:14px;padding-top:0}
.inline{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.inline>div{flex:1;min-width:130px}
.inline label{margin-top:0}
.lock{font-size:.82rem;color:#8b9bb4;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.04)}
.chk{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--muted);margin:10px 0 0;font-weight:600}
.chk input{width:auto}
video.player{width:100%;border-radius:14px;background:#000;max-height:60vh}
.seg{display:flex;gap:6px}
.seg button{flex:1}
@media (max-width:900px){.cc-grid{grid-template-columns:1fr}}

/* inputs outside <form> (tables, admin headers) */
.table input:not([type=checkbox]):not([type=file]),.table select,.admin-top select,.admin-top input:not([type=checkbox]),.inline select{
  background:rgba(255,255,255,.05);border:1px solid var(--line);color:#fff;padding:9px 12px;border-radius:12px;font:inherit;font-size:.9rem;outline:none;
}
.table input:focus,.table select:focus,.admin-top select:focus{border-color:var(--accent);background:rgba(59,130,246,.06)}
input[type=file]{padding:10px 12px!important;font-size:.88rem;color:var(--muted)}
input[type=file]::file-selector-button{margin-right:12px;padding:7px 14px;border:0;border-radius:999px;background:rgba(255,255,255,.12);color:#fff;font:inherit;font-weight:700;font-size:.82rem;cursor:pointer}
input[type=file]::file-selector-button:hover{background:rgba(255,255,255,.22)}

/* course categories */
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:40px}
.cat{display:block;text-align:left;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:24px;padding:30px 28px;cursor:pointer;transition:transform .25s,border-color .25s,box-shadow .25s;color:inherit;font:inherit}
.cat:hover{transform:translateY(-6px);border-color:rgba(96,165,250,.55);box-shadow:0 22px 46px rgba(0,0,0,.4)}
.cat .ic{display:grid;place-items:center;width:54px;height:54px;border-radius:16px;background:var(--primary);font-weight:800;font-size:1.3rem;color:#fff;margin-bottom:18px}
.cat h3{font-size:1.4rem;letter-spacing:-.02em;margin-bottom:6px}
.cat p{color:var(--muted);font-size:.95rem}
.cat .more{display:inline-block;margin-top:16px;color:var(--accent2);font-weight:600;font-size:.9rem}
.cat small{display:block;margin-top:12px;color:#8b9bb4;font-weight:600;font-size:.8rem}
.crumbs button{background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:0}
.crumbs button:hover,.crumbs a:hover{color:var(--accent2)}
.course .badge2{display:inline-block;font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.08);color:#b8c4d6;margin-bottom:10px}
.course .badge2.ok{background:rgba(59,224,122,.14);color:#5df09b}
@media(max-width:900px){.cats{grid-template-columns:1fr}}

.price{display:block;font-weight:800;font-size:1.25rem;color:var(--accent2);margin:0 0 8px;letter-spacing:-.02em}
.price small{font-size:.75rem;color:#8b9bb4;font-weight:600;margin-left:3px}
.pricebox{display:flex;justify-content:space-between;align-items:center;background:rgba(96,165,250,.1);border:1px solid rgba(96,165,250,.35);border-radius:14px;padding:12px 16px;margin:0 0 6px}
.pricebox span{color:#cbd5e1;font-size:.9rem}.pricebox b{font-size:1.25rem;color:var(--accent2)}

.lockbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:rgba(96,165,250,.1);border:1px solid rgba(96,165,250,.35);border-radius:14px;padding:10px 16px;margin-top:16px;font-size:.92rem;color:#cbd5e1}
.lockbar b{color:#fff}

.paybox{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-top:14px}
.paybox h4{margin-bottom:8px}
.pay-amt{font-size:1.8rem;font-weight:800;color:var(--accent2);letter-spacing:-.02em;margin-bottom:8px}
.pay-steps{margin:0 0 14px 18px;padding:0;color:#cbd5e1;font-size:.92rem;line-height:1.6}
.pay-steps li{margin-bottom:6px}
.pay-steps code{background:rgba(255,255,255,.1);padding:2px 8px;border-radius:8px;color:#fff;font-weight:700;word-break:break-all}
.warn{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);border-radius:12px;padding:10px 14px;color:#fca5a5;font-size:.9rem;margin-bottom:6px}
.badge.pend{background:rgba(255,190,50,.18);color:#ffd36b}

.stepper{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.stepper span{flex:1;min-width:110px;display:flex;align-items:center;gap:8px;font-size:.8rem;font-weight:700;color:#7f90aa;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:999px;padding:7px 12px}
.stepper span i{font-style:normal;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.1);font-size:.72rem}
.stepper span.on{color:#fff;border-color:rgba(96,165,250,.5)}
.stepper span.on i{background:var(--primary)}
.stepper span.done i{background:#2fc872}
.pay-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.pay-top small,.ipa-card small{color:#8b9bb4;font-weight:700;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase}
.pay-top .pay-amt{margin:2px 0 0;font-size:2.2rem}
.pay-for{color:#cbd5e1;font-weight:600;font-size:.95rem}
.ipa-card{background:linear-gradient(135deg,rgba(37,99,235,.22),rgba(96,165,250,.12));border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:14px 16px;margin-bottom:16px}
.ipa-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap}
.ipa-row code{font-size:1.15rem;background:none;padding:0;color:#fff;font-weight:800;word-break:break-all}
.ipa-name{margin-top:6px;font-size:.88rem;color:#cbd5e1}

.reqbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:26px;padding:20px 24px;border:1px dashed rgba(255,255,255,.22);border-radius:var(--radius);background:rgba(255,255,255,.03);color:var(--muted)}
.reqbar span{font-weight:600}
.modal textarea{min-height:76px}


/* keyboard focus */
:focus-visible{outline:2px solid #60a5fa;outline-offset:3px}
</style>
